<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LabourConnect — Directory & Dashboard</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Google Translate API -->
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateInit"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-left">
        <h1>Find Skilled Workers — Demo</h1>
        <p>Browse categories, filter by city & radius, and view available workers.</p>
      </div>

      <div class="hero-right">
        <div class="brand">LabourConnect</div>
        <div class="subtitle">Demo mode</div>

        <!-- Multilingual Dropdown -->
        <div id="translate-box" class="translate-box"></div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">

    <div class="section-title">
      <h2>Browse by Category</h2>
      <p>Select a category to filter workers and jobs automatically.</p>
    </div>

    <div class="controls" id="controls">
      <div class="glass search">
        <input id="searchInput" placeholder="Search trade (e.g., Electrician)" />
      </div>

      <div class="glass city">
        <input id="cityInput" placeholder="City (e.g., Mumbai)" />
      </div>

      <select id="radiusSelect" class="glass radius">
        <option value="5">Radius 5 km</option>
        <option value="10" selected>Radius 10 km</option>
        <option value="25">Radius 25 km</option>
      </select>
    </div>

    <div id="filterChips" class="chips"></div>

    <div id="iconGrid" class="grid"></div>

    <div class="dashboard">
      <div class="box">
        <h3>Available Workers <span id="workersCount" class="count"></span></h3>
        <div class="list" id="workerList"></div>
      </div>

      <div class="box">
        <h3>Customer Job Posts <span id="jobsCount" class="count"></span></h3>
        <div class="list" id="jobList"></div>
      </div>
    </div>
  </main>

  <footer>LabourConnect — Glassy Dark UI Edition</footer>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
