<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LabourConnect — Demo Directory & Dashboard</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Google Translate widget (auto-detect + dropdown) -->
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateInit" defer></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="nav-glass">
    <div class="nav-inner">
      <div class="nav-left">
        <div class="logo">LabourConnect</div>
        <div class="logo-sub">Demo</div>
      </div>

      <div class="nav-center">
        <input id="miniSearch" class="mini-search" placeholder="Search trades or cities..." />
      </div>

      <div class="nav-right">
        <div id="translate-box" class="translate-box" aria-hidden="false"></div>
        <button id="themeToggle" class="btn btn-blue" title="Toggle demo action">Action</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-left">
        <h1>Find Skilled Workers — Demo</h1>
        <p>Browse categories, filter by city & radius, and view available workers or job posts.</p>
      </div>
      <div class="hero-right">
        <div class="hero-card">
          <div class="brand">LabourConnect</div>
          <div class="mode">Demo mode</div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <section class="controls-row">
      <div class="glass search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Search trade (e.g., Electrician)" />
      </div>

      <div class="glass city">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-4.35 7-10a7 7 0 10-14 0c0 5.65 7 10 7 10z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="cityInput" placeholder="City (e.g., Mumbai)" />
      </div>

      <select id="radiusSelect" class="glass radius">
        <option value="5">Radius 5 km</option>
        <option value="10" selected>Radius 10 km</option>
        <option value="25">Radius 25 km</option>
      </select>

      <div class="btn-group">
        <button class="btn btn-orange" id="clearFilters">Clear</button>
        <button class="btn btn-green" id="applyFilters">Apply</button>
      </div>
    </section>

    <div id="filterChips" class="chips"></div>

    <!-- icon grid: small square mobile-app style tiles -->
    <div id="iconGrid" class="grid" aria-live="polite"></div>

    <div class="dashboard">
      <div class="box">
        <div class="box-head">
          <h3>Available Workers (Profiles)</h3>
          <div class="badge" id="workersCount">0</div>
        </div>
        <div class="list" id="workerList"></div>
      </div>

      <div class="box">
        <div class="box-head">
          <h3>Customer Job Posts</h3>
          <div class="badge" id="jobsCount">0</div>
        </div>
        <div class="list" id="jobList"></div>
      </div>
    </div>
  </main>

  <footer>LabourConnect demo — glassy UI with Google Translate</footer>

  <script src="script.js" defer></script>
</body>
</html>
